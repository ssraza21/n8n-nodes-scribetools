name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # isolated-vm (pulled in for `n8n-node dev`) needs a native build we don't use here.
      - run: npm ci --ignore-scripts
      - run: npx n8n-node lint
      - run: npx n8n-node build
      - run: npm test
